<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Explore six shades of curiosity with Souliberation's free, adults-only reflection quiz."><title>The Curiosity Edit · Souliberation</title>
<style>
:root{--paper:#faf5ec;--ink:#302b26;--muted:#73685d;--accent:#8c4d32;--line:#ded2c1;--sage:#536052}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,sans-serif}button,input,textarea{font:inherit}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:var(--accent);text-underline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #63715d;outline-offset:4px}header{max-width:1250px;margin:auto;padding:25px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;font-size:24px;letter-spacing:.04em}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:650;color:var(--accent)}header button,.link{border:0;background:none;color:var(--muted);padding:8px;text-decoration:underline;text-underline-offset:4px}main{max-width:1160px;margin:auto;padding:60px 5% 80px}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:Georgia,serif;font-weight:400;line-height:1.08}h1{font-size:clamp(49px,7.8vw,96px);letter-spacing:-.055em;margin-bottom:26px}h1 em{color:var(--accent);font-weight:400}h2{font-size:clamp(32px,4vw,49px);letter-spacing:-.025em}h3{font-size:26px;margin-bottom:14px}p{max-width:650px}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:50px}.intro{font-size:18px;color:var(--muted);max-width:490px}.art{position:relative;aspect-ratio:1;border-radius:50% 50% 6px 6px;background:#eee3d3;overflow:hidden;display:grid;place-items:center}.art svg{width:94%;height:94%}.art .caption{position:absolute;bottom:22px;font-size:10px;letter-spacing:.2em;text-transform:uppercase}.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.04em;padding:5px 11px;border:1px solid var(--line);border-radius:30px;margin:0 6px 10px 0}.primary{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:15px 25px;border-radius:4px;font-weight:600;transition:transform .2s,background .2s}.primary:hover{background:#723b26;transform:translateY(-1px)}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);padding:13px 20px;border-radius:4px}.primary:disabled{opacity:.4;cursor:default;transform:none}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.age{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:24px 0 16px}.age input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px}.tiny{font-size:12px;color:var(--muted)}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:60px;border-top:1px solid var(--line)}.theme{padding:26px 20px 16px 0;border-bottom:1px solid var(--line)}.theme p{font-size:13px;color:var(--muted);margin-bottom:4px}.symbol{font-size:27px;color:var(--accent);display:block;margin-bottom:10px}.section{margin-top:60px}.quiz{max-width:700px;margin:0 auto}.topline{display:flex;justify-content:space-between;gap:15px;font-size:12px;color:var(--muted)}progress{appearance:none;width:100%;height:4px;border:0;display:block;background:var(--line);margin:12px 0 45px}progress::-webkit-progress-bar{background:var(--line)}progress::-webkit-progress-value{background:var(--accent)}progress::-moz-progress-bar{background:var(--accent)}.qtitle{font-size:clamp(29px,4vw,43px);line-height:1.22;margin-bottom:20px}.options{display:grid;gap:10px;margin-top:28px}.option{width:100%;text-align:left;border:1px solid var(--line);background:#fffcf7;border-radius:5px;padding:14px 17px;display:flex;justify-content:space-between;align-items:center;gap:15px}.option:hover{border-color:var(--accent)}.option[aria-checked=true]{background:#efe0cf;border-color:var(--accent)}.option .circle{height:19px;width:19px;flex-shrink:0;border:1px solid #baa993;border-radius:50%}.option[aria-checked=true] .circle{border:5px solid var(--accent)}.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;align-items:center}.callout{background:#edeedc;border-left:3px solid var(--sage);padding:18px 22px;margin:27px 0;font-size:14px}.results-heading{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}.mini-art{background:#eee3d3;border-radius:50%;aspect-ratio:1;max-width:300px;display:grid;place-items:center;margin:auto;width:100%}.mini-art svg{width:90%;height:90%}.scorecard{background:#fffaf3;border:1px solid var(--line);padding:28px;border-radius:7px}.score-row{margin-bottom:22px}.score-meta{display:flex;justify-content:space-between;gap:20px;font-size:14px;margin-bottom:7px}.bar{height:6px;border-radius:4px;background:#e8dfd1;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:4px}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:30px}.report-card{padding:26px;background:#fffaf3;border:1px solid var(--line);border-radius:6px}.report-card p{font-size:14px}.report-card blockquote{border-left:2px solid var(--accent);padding-left:16px;margin:20px 0;color:var(--muted);font-size:14px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:30px;padding:8px 14px;background:#fffaf3;font-size:13px}.chip[aria-pressed=true]{background:var(--sage);color:white;border-color:var(--sage)}details{border-top:1px solid var(--line);padding:18px 0;font-size:14px}summary{cursor:pointer;font-weight:600}.modal{position:fixed;inset:0;background:#302b2677;display:grid;place-items:center;padding:24px;z-index:5}.modal article{background:var(--paper);padding:28px;max-height:85vh;overflow:auto;max-width:650px;border-radius:8px}.modal h2{font-size:32px}.modal li{margin-bottom:12px}footer{padding:25px 5%;max-width:1250px;margin:auto;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--muted)}textarea{width:100%;background:#fffcf7;padding:15px;border:1px solid var(--line);border-radius:5px;color:var(--ink);resize:vertical;min-height:115px}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:10px 20px;border-radius:5px;z-index:9;max-width:90%;font-size:14px}.hidden{display:none!important}@media(max-width:720px){main{padding-top:35px}.hero{grid-template-columns:1fr;gap:35px}.hero .art{max-width:400px;width:100%;margin:auto}.themes{grid-template-columns:1fr 1fr;margin-top:38px}.result-grid,.results-heading{grid-template-columns:1fr}.results-heading .mini-art{max-width:220px}.qnav{flex-wrap:wrap}header{padding:18px 5%}.brand{font-size:21px}footer{flex-direction:column;gap:6px}.quiz progress{margin-bottom:30px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media print{header button,footer,.actions,.qnav,.interactive,.modal,#toast{display:none!important}main{padding:0;max-width:none}body{font-size:12px;background:white}.result-grid{display:block}.report-card,.scorecard{break-inside:avoid;margin-bottom:15px}.mini-art{max-width:180px}.section{margin-top:25px}h1{font-size:42px}h2{font-size:28px}details>*{display:block}details{display:none}}
</style></head><body>
<header><span class="brand">souliberation<span style="color:var(--accent)"> ✳</span></span><button id="about">About this pilot</button></header>
<main id="app"></main><footer><span>THE CURIOSITY EDIT · FREE PILOT 01</span><span>Explore at your own pace. Every boundary belongs to you.</span></footer><div id="overlay"></div><div id="toast" role="status" class="hidden"></div>
<script>
'use strict';
const CONFIG={version:'pilot-01'};
const THEMES=[
{id:'sensory',name:'Sensory',symbol:'01',title:'The Sensory Explorer',short:'Texture, atmosphere & presence',meaning:'You gave positive responses to the sensory details of an experience: texture, atmosphere, or contrast.',prompt:'Which details help you feel present, and which feel distracting?',questions:['Textures and fabrics can be a meaningful part of an intimate atmosphere.','I notice how sound, lighting, or scent changes what appeals to me.','I am curious about a contrast between soft and firmer touch, within agreed limits.']},
{id:'leading',name:'Leading',symbol:'02',title:'The Intentional Guide',short:'Direction, initiative & agreed roles',meaning:'You gave positive responses to setting the direction within an agreed dynamic.',prompt:'What would you enjoy guiding, and what decisions would you want to share?',questions:['I like the idea of planning an experience that another consenting adult chooses to follow.','Setting the pace within boundaries we have discussed appeals to me.','Taking on a clearly agreed leading role sounds interesting to me.']},
{id:'guided',name:'Being guided',symbol:'03',title:'The Receptive Explorer',short:'Receiving, trust & chosen direction',meaning:'You gave positive responses to choosing to let another adult guide an agreed experience.',prompt:'What agreements would help you enjoy being guided while keeping your choices clear?',questions:['I am curious about letting a trusted adult guide an experience we have agreed on.','Receiving direction can appeal to me when I can pause or change my mind.','I like the idea of someone else planning the pace while checking in with me.']},
{id:'imagination',name:'Imagination',symbol:'04',title:'The Playful Storyteller',short:'Characters, stories & playful expression',meaning:'You gave positive responses to using imagination, characters, or stories to shape an experience.',prompt:'What part of an imagined role appeals to you: the story, mood, or way of expressing yourself?',questions:['Inventing a playful character with another consenting adult sounds appealing.','A fictional scenario can interest me even if I would keep it entirely in my imagination.','I am curious about expressing a side of myself through an agreed role or story.']},
{id:'anticipation',name:'Anticipation',symbol:'05',title:'The Slow-Burn Explorer',short:'Build-up, suspense & deliberate pacing',meaning:'You gave positive responses to a deliberate build-up and agreed moments of suspense.',prompt:'What kind of anticipation feels enjoyable, and when would you prefer clarity?',questions:['A slow build-up can be as appealing to me as the main experience.','I enjoy imagining a small surprise whose boundaries have already been agreed.','Deliberate pauses can make an experience feel more engaging to me.']},
{id:'novelty',name:'Discovery',symbol:'06',title:'The Curious Wanderer',short:'Variation, possibility & discovery',meaning:'You gave positive responses to variation and discovering new possibilities.',prompt:'What is one variation you are curious about, and what would you like to keep familiar?',questions:['I am curious about trying a small variation on an experience I already enjoy.','Learning about an unfamiliar kink can be interesting even if I never try it.','Choosing a new theme or atmosphere together sounds appealing to me.']}
];
// Interleave themes to avoid twenty nearly identical questions in a row.
const QUESTIONS=[];for(let round=0;round<3;round++)for(const t of THEMES)QUESTIONS.push({theme:t.id,text:t.questions[round]});
QUESTIONS.push({theme:'pace',text:'If you choose to explore, what pace appeals to you today?',context:true,options:['A slow introduction with familiar elements','A clear plan, with room to adjust','Small changes we choose together','I am only reflecting for now','I am not sure yet']});
QUESTIONS.push({theme:'setting',text:'What would most help you feel comfortable discussing a new idea?',context:true,options:['Time to think privately first','A direct conversation about boundaries','A relaxed conversation with no expectation to act','Learning more before discussing it','I am not sure yet']});
const RATINGS=[['Doesn’t appeal to me',0],['A little curious',1],['Somewhat appealing',2],['Very appealing',3],['Strongly appeals to me',4],['Not sure yet','unknown']];
let answers=Array(20).fill(null),step=0,screen='home',fantasy=new Set(),ageConfirmed=false;
const app=document.getElementById('app');const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function flower(){return `<svg viewBox="0 0 400 400" aria-hidden="true"><g transform="translate(200 200)" fill="none" stroke="#955637" stroke-width="1.1">${THEMES.map((t,i)=>`<ellipse rx="65" ry="137" transform="rotate(${i*60}) translate(0 -47)" fill="${['#bd795c','#caa078','#b9bc9b','#d4b2a0','#bfa581','#e1c69f'][i]}" fill-opacity=".32"/>`).join('')}<circle r="32" fill="#faf5ec"/><circle r="13" fill="#8c4d32"/></g></svg>`}
function focusTop(){window.scrollTo({top:0,behavior:'instant'});const h=app.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}}
function home(){screen='home';app.innerHTML=`<section class="hero"><div><p class="eyebrow">A little curiosity. A little self-discovery.</p><h1>Meet your<br><em>curious side.</em></h1><p class="intro">What draws you in? Explore six shades of kink curiosity, then discover a reflection made from your answers.</p><div><span class="pill">20 short prompts</span><span class="pill">About 3–5 minutes</span><span class="pill">Free pilot</span></div><label class="age"><input id="age" type="checkbox" ${ageConfirmed?'checked':''}><span>I am 18 or older and understand this is an adult self-reflection experience.</span></label><button id="start" class="primary" ${ageConfirmed?'':'disabled'}>Explore my curiosity</button><p class="tiny" style="margin-top:14px">No account or email needed. Answers stay in this page’s memory and clear on refresh or exit. For fun and reflection; this original pilot has not been scientifically validated.</p></div><div class="art">${flower()}<span class="caption">Many shades. Your own combination.</span></div></section><section class="themes">${THEMES.map(t=>`<div class="theme"><span class="symbol">${t.symbol}</span><h3>${t.name}</h3><p>${t.short}</p></div>`).join('')}</section><div class="section"><p class="eyebrow">Your own pace, always</p><h2>Curiosity can stay<br>in your imagination.</h2><p class="muted">Answer for what appeals to you today, including fantasy. You can mark themes as fantasy-only in your report. Choosing an answer never gives anyone permission to act on it.</p></div>`;$('#age').onchange=e=>{ageConfirmed=e.target.checked;$('#start').disabled=!ageConfirmed};$('#start').onclick=()=>{step=0;quiz();focusTop()};}
function quiz(){screen='quiz';const q=QUESTIONS[step],t=THEMES.find(t=>t.id===q.theme);const opts=q.context?q.options.map((v,i)=>[v,i]):RATINGS;app.innerHTML=`<section class="quiz"><div class="topline"><span>${step<18?'YOUR CURIOSITY':'YOUR COMFORT'} · ${step+1} / 20</span><button class="link" id="exit" style="padding:0">Exit & clear</button></div><progress aria-label="Quiz progress" value="${step}" max="20"></progress><p class="eyebrow">${t?t.symbol+' '+t.name:'Make it your own'}</p><h2 class="qtitle">${q.text}</h2><p class="muted" style="font-size:14px">${q.context?'Choose what fits today. These answers personalize your report and do not affect your scores.':'Think of consensual experiences between adults. Your answer can include imagination or fantasy.'}</p><div class="options" role="radiogroup" aria-label="Choose an answer">${opts.map(([label,value])=>`<button class="option" role="radio" aria-checked="${answers[step]===value}" data-value="${value}"><span>${esc(label)}</span><span class="circle"></span></button>`).join('')}</div><div class="qnav"><button id="back" class="secondary">${step===0?'Introduction':'Back'}</button><button id="skip" class="link">Skip this question</button><button id="next" class="primary" ${answers[step]===null?'disabled':''}>${step===19?'See my reflection':'Continue'}</button></div><p class="tiny" style="margin-top:20px">All preferences are welcome. Uncertainty and skipped answers are kept separate from low interest.</p></section>`;
app.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{let v=b.dataset.value;answers[step]=v==='unknown'?v:Number(v);app.querySelectorAll('[data-value]').forEach(el=>el.setAttribute('aria-checked',String(el===b)));$('#next').disabled=false});$('#next').onclick=advance;$('#skip').onclick=()=>{answers[step]='skip';advance()};$('#back').onclick=()=>{if(step===0)home();else{step--;quiz()}top()};$('#exit').onclick=clearAll;
const radios=[...app.querySelectorAll('[role=radio]')];radios.forEach((b,i)=>b.onkeydown=e=>{if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();const next=radios[(i+(['ArrowDown','ArrowRight'].includes(e.key)?1:-1)+radios.length)%radios.length];next.focus();next.click()}});}
function advance(){if(step<19){step++;quiz()}else results();focusTop()}
function scores(){return THEMES.map(t=>{let vals=QUESTIONS.map((q,i)=>q.theme===t.id&&typeof answers[i]==='number'?answers[i]:null).filter(v=>v!==null);return{...t,count:vals.length,score:vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length/4*100):null}})}
function label(t){return t.count<2?'Still taking shape':t.score>=75?'Strong interest':t.score>=50?'Open curiosity':t.score>=25?'A little curiosity':'Less appealing today'}
function resultInfo(){const all=scores(),eligible=all.filter(t=>t.count>=2),ranked=[...eligible].sort((a,b)=>b.score-a.score),high=ranked.filter(t=>t.score>=50),topScore=high.length?high[0].score:null,leaders=high.filter(t=>t.score===topScore);let title='Your curiosity, at your pace',intro='Your answers leave room to reflect. Familiarity, privacy, and choosing what suits you are valid preferences.';if(!eligible.length){title='Room to wonder';intro='There are too few rated answers to describe a theme yet. You can still use the reflection prompts below.'}else if(leaders.length>1){title='A blend of curiosities';intro=`Your strongest responses were shared across ${leaders.map(t=>t.name.toLowerCase()).join(', ')}. There is room for more than one preference.`}else if(leaders.length===1){title=leaders[0].title;intro=leaders[0].meaning}return{all,eligible,ranked,high,title,intro}}
function results(){screen='results';const r=resultInfo(),count=answers.slice(0,18).filter(a=>typeof a==='number').length;const chosen=r.high.slice(0,3);let mix='';const lead=r.all.find(t=>t.id==='leading'),follow=r.all.find(t=>t.id==='guided');if(lead.count>=2&&follow.count>=2&&lead.score>=50&&follow.score>=50)mix='You showed curiosity about both leading and being guided. You can enjoy different roles in different contexts; these responses do not assign you a fixed role.';
app.innerHTML=`<section class="results-heading"><div><p class="eyebrow">Your curiosity edit · Pilot 01</p><h1 style="font-size:clamp(42px,6vw,68px)">${r.title}</h1><p class="intro">${r.intro}</p><span class="pill">${count} / 18 preference prompts rated</span><span class="pill">A snapshot of today</span></div><div class="mini-art">${flower()}</div></section><div class="callout">Curiosity is yours to interpret. A result never implies consent, readiness, compatibility, or a need to push a boundary.</div><section class="section"><p class="eyebrow">Six shades, your combination</p><h2>Your curiosity palette</h2><p class="muted">Bars show the average of your rated answers within each theme. They are not percentiles or comparisons with other people. Two rated answers are needed to describe a theme.</p><div class="scorecard">${r.all.map(t=>`<div class="score-row"><div class="score-meta"><span>${t.symbol} ${t.name}</span><span>${label(t)} · ${t.count}/3 rated</span></div><div class="bar" role="img" aria-label="${t.name}: ${label(t)}, ${t.count} of 3 rated"><div class="fill" style="width:${t.count>=2?t.score:0}%;background:${t.id==='guided'||t.id==='novelty'?'#66715a':'#9a6348'}"></div></div></div>`).join('')}</div></section>${mix?`<div class="callout">${mix}</div>`:''}<section class="section"><p class="eyebrow">A closer look</p><h2>What your answers suggest</h2><div class="result-grid">${(chosen.length?chosen:r.ranked.slice(0,2)).map(t=>`<article class="report-card"><span class="symbol">${t.symbol}</span><h3>${t.name}</h3><p>${t.score>=50?t.meaning:'This theme felt less appealing or only slightly appealing in your rated answers today. There is no expectation to develop an interest in it.'}</p><blockquote>${t.prompt}</blockquote><p class="tiny">Based on ${t.count} rated answers.</p><details><summary>See the answers behind this theme</summary>${QUESTIONS.map((q,i)=>q.theme===t.id?`<p>${q.text}<br><strong>${answerText(i)}</strong></p>`:'').join('')}</details></article>`).join('')}${!r.eligible.length?'<article class="report-card"><h3>Start with one question</h3><p>What atmosphere helps you feel most at ease, even when you are only thinking about something new?</p></article>':''}</div></section><section class="section interactive"><p class="eyebrow">Imagination is its own destination</p><h2>Some things can stay a fantasy.</h2><p class="muted">Tap any themes you would prefer to keep in your imagination. This changes the notes in your saved reflection, not your curiosity scores.</p><div class="chips">${r.all.map(t=>`<button class="chip" data-fantasy="${t.id}" aria-pressed="${fantasy.has(t.id)}">${t.symbol} ${t.name}</button>`).join('')}</div><p id="fantasy-note" class="tiny"></p></section><section class="section"><p class="eyebrow">The conditions you chose</p><h2>Your pace. Your conversation.</h2><div class="result-grid"><article class="report-card"><h3>Your preferred pace</h3><p>${answerText(18)}</p></article><article class="report-card"><h3>What helps you discuss it</h3><p>${answerText(19)}</p></article></div><div class="callout">If you decide to discuss an idea, agree on boundaries, ways to pause or stop, and how you will check in. Anyone can change their mind. A quiz answer is a conversation starter, never permission.</div></section><section class="section"><div class="actions"><button class="secondary" id="download">Save my reflection (.txt)</button><button class="secondary" id="print">Print / save as PDF</button><button class="link" id="review">Review my answers</button><button class="link" id="restart">Clear & start again</button></div></section><section class="section">${methodology()}</section>`;
app.querySelectorAll('[data-fantasy]').forEach(b=>b.onclick=()=>{const id=b.dataset.fantasy;if(fantasy.has(id))fantasy.delete(id);else fantasy.add(id);b.setAttribute('aria-pressed',String(fantasy.has(id)));fantasyNote()});fantasyNote();$('#download').onclick=()=>download('souliberation-my-reflection.txt',reportText());$('#print').onclick=()=>window.print();$('#review').onclick=()=>{step=0;quiz();focusTop()};$('#restart').onclick=clearAll;}

function fantasyNote(){const names=THEMES.filter(t=>fantasy.has(t.id)).map(t=>t.name);$('#fantasy-note').textContent=names.length?'Fantasy-only notes: '+names.join(', ')+'. These interests do not describe an intention to act.':'No fantasy-only notes selected. This does not imply willingness to act on any theme.'}
function answerText(i){const a=answers[i];if(a===null||a==='skip')return 'Skipped';if(a==='unknown')return 'Not sure yet';return QUESTIONS[i].context?QUESTIONS[i].options[a]:RATINGS.find(r=>r[1]===a)[0]}
function reportText(){const r=resultInfo();return ['SOULIBERATION · THE CURIOSITY EDIT · '+CONFIG.version,r.title,r.intro,'',...r.all.map(t=>`${t.name}: ${label(t)} (${t.count}/3 rated).${fantasy.has(t.id)?' Fantasy-only note selected.':''}`),'','These are original, unvalidated reflection scores, not population percentiles. They do not imply consent or readiness. No fantasy-only note does not imply willingness to act.','','MY REFLECTION PROMPTS',...r.high.map(t=>t.prompt),'','MY COMFORT',answerText(18),answerText(19),'','Consent is specific and ongoing. Discuss boundaries, check-ins and ways to stop. Anyone can change their mind.','','MY ANSWERS',...QUESTIONS.map((q,i)=>`${i+1}. ${q.text}\n${answerText(i)}`),'','READING & METHOD','18 original preference prompts, 3 per theme. Each numeric answer = 0–4. Theme score = mean / 4 × 100, requiring 2 rated responses. Not sure and skip are excluded. 75+ strong interest, 50+ open curiosity, 25+ a little curiosity, below 25 less appealing today. Headline uses highest eligible score of at least 50; exact ties receive a blended headline. Theme notes remain editable.','Community guidance: https://ncsfreedom.org/key-programs-2/consent-counts/','Research context: https://pubmed.ncbi.nlm.nih.gov/30956128/','These sources provide context. They did not develop, validate or endorse this questionnaire.'].join('\n')}
function download(name,text){const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Your file is ready to save. It contains personal reflections.')}
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),4500)}
function clearAll(){answers=Array(20).fill(null);fantasy.clear();step=0;ageConfirmed=false;home();focusTop()}
function methodology(){return `<details><summary>How this reflection works</summary><p>This pilot uses 18 original preference prompts across six themes, plus two comfort questions. Each rated preference answer has a value from 0 to 4. A theme’s bar is its mean divided by 4, scaled to 100. “Not sure” and skipped answers are excluded.</p><p>At least two of a theme’s three prompts must be rated to describe it. Strong interest begins at 75, open curiosity at 50, and a little curiosity at 25. Lower values are described as less appealing today. These thresholds are editorial choices for this pilot.</p><p>A headline highlights the highest eligible theme at 50 or above. Exact ties receive a blended headline. A lower score, missing answers, or “not sure” never means a shortcoming. Your preferences can change.</p></details><details><summary>Sources & scope</summary><p>Community consent guidance informed the boundaries and check-in language. Research provides background for the subject. The themes, questions, scoring and reports are original editorial work for Souliberation. This is an exploratory entertainment pilot, with no psychometric validation or endorsement from these sources.</p><p><a href="https://ncsfreedom.org/key-programs-2/consent-counts/" target="_blank" rel="noopener noreferrer">NCSF · Consent Counts and negotiation resources</a></p><p><a href="https://pubmed.ncbi.nlm.nih.gov/30956128/" target="_blank" rel="noopener noreferrer">De Neef et al. (2019) · BDSM from an integrative biopsychosocial perspective</a></p></details><details><summary>Privacy & saving</summary><p>Quiz answers and fantasy notes are held in this open page’s memory. The quiz code does not transmit them, store them in cookies, or save them to browser storage. Refreshing, closing the page or choosing “Clear & start again” removes this state. Hosting providers may process ordinary access data.</p><p>Saving or printing a reflection creates a personal copy on your device or chosen storage. Anyone with access to that copy can read it.</p></details>`}
$('#about').onclick=()=>{const overlay=$('#overlay');overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="about-title"><article><button class="secondary" id="close-modal" style="float:right">Close</button><p class="eyebrow">Souliberation · Pilot 01</p><h2 id="about-title">A space for curiosity.</h2><p>An original, adults-only reflection experience. Twenty prompts, six themes, and a report you can take at your own pace.</p>${methodology()}<p class="tiny">Estimated time is a draft estimate, to be checked with pilot participants.</p></article></div>`;const modal=overlay.querySelector('.modal'),btn=$('#close-modal');function close(){overlay.innerHTML='';$('#about').focus()}btn.onclick=close;btn.focus();modal.onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const els=[...modal.querySelectorAll('button,a,summary')];let first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};modal.onclick=e=>{if(e.target===modal)close()}};
home();
</script></body></html>
